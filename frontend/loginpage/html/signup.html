<!-- frontend/loginpage/html/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Learn & Track — Sign Up</title>

  <link rel="stylesheet" href="/shared/css/reset.css" />
  <link rel="stylesheet" href="/shared/css/variables.css" />
  <link rel="stylesheet" href="/shared/css/base.css" />
  <link rel="stylesheet" href="/shared/css/utilities.css" />

  <link rel="stylesheet" href="/loginpage/css/global.css" />
  <link rel="stylesheet" href="/loginpage/css/signup.css" />

  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css" />
</head>
<body>
  <div class="signup-container" id="signupContainer">
    <h2>Create Your Account</h2>

    <form id="signupForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter a unique username"
          required
        />
        <div id="usernameAvailability" class="availability-message"></div>
      </div>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="First name"
          required
        />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Last name"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
          <i class="fas fa-eye toggle-password" id="toggleSignupPassword" aria-label="Show password"></i>
        </div>

        <!-- Settings-style status icon shown after blur -->
        <div id="signup-pass-status" class="st-status-icon"></div>

        <div id="passwordError" class="error-message"></div>

        <!-- Short requirement labels like Settings -->
        <div class="st-pass-req-list signup-pass-req-list">
          <p id="req-length" class="req-item">8+ characters</p>
          <p id="req-upper"  class="req-item">Uppercase letter</p>
          <p id="req-lower"  class="req-item">Lowercase letter</p>
          <p id="req-num"    class="req-item">Number</p>
          <p id="req-symbol" class="req-item">Symbol</p>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm password"
            required
          />
          <i class="fas fa-eye toggle-password" id="toggleSignupConfirmPassword" aria-label="Show password"></i>
        </div>

        <!-- Settings-style match icon -->
        <div id="signup-confirm-pass-status" class="st-status-icon"></div>

        <div id="confirmPasswordError" class="error-message"></div>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">
          I agree to the <a href="#">Terms &amp; Conditions</a>
        </label>
      </div>

      <button type="submit" class="btn-signup">Create Account</button>
    </form>

    <div id="signupNotification" class="notification"></div>
    <p class="login-link">
      Already have an account?
      <a href="/loginpage/html/login.html">Login here</a>
    </p>
  </div>

  <div class="signup-success" id="signupSuccess" style="display:none;">
    <div class="success-message">
      <p>Your account has been successfully created!</p>
      <button class="btn-login" id="loginBtn">Go to Login</button>
    </div>
  </div>

  <script src="/loginpage/js/signup.js"></script>
</body>
</html>
